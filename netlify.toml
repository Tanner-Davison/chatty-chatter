[build]
  publish = "apps/web/dist"
  command = "npm ci && npm run build"

[build.environment]
  # Use the newer Ubuntu Jammy build image (22.04)
  BUILD_IMAGE = "jammy"
  NODE_VERSION = "22"

# Force HTTPS redirects
[[redirects]]
  from = "http://www.chattychatter.com/*"
  to = "https://www.chattychatter.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://chattychatter.com/*"
  to = "https://www.chattychatter.com/:splat"
  status = 301
  force = true

# The API is proxied through this domain so its session cookie is first-party.
# Socket.IO connects to Heroku directly (Netlify can't proxy websockets).
[[redirects]]
  from = "/api/*"
  to = "https://protected-retreat-97985-3868e60ef0db.herokuapp.com/api/:splat"
  status = 200
  force = true

# SPA fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
