# Checks every pull request and push to main. On main, a passing build that
# touched the server is deployed to Heroku automatically. Netlify deploys the
# client on its own.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # mongodb-memory-server downloads a mongod binary on first use.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build -w @chatty/server

  deploy-server:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # One deploy at a time, in order.
    concurrency:
      group: heroku-deploy
      cancel-in-progress: false
    env:
      HEROKU_APP: protected-retreat-97985
      API_URL: https://protected-retreat-97985-3868e60ef0db.herokuapp.com
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Did the server change?
        id: changes
        run: |
          before="${{ github.event.before }}"
          # A brand-new branch or force push has no usable "before"; deploy to be safe.
          if [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then
            echo "server=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$before" "${{ github.sha }}" \
            | grep -qE '^(apps/server/|packages/shared/|package(-lock)?\.json$|Procfile$|\.nvmrc$)'; then
            echo "server=true" >> "$GITHUB_OUTPUT"
          else
            echo "server=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Heroku
        if: steps.changes.outputs.server == 'true'
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          if [ -z "$HEROKU_API_KEY" ]; then
            echo "::error::Add the HEROKU_API_KEY repository secret to enable deploys."; exit 1
          fi
          git push "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP}.git" HEAD:refs/heads/main

      - name: Check the new release is healthy
        if: steps.changes.outputs.server == 'true'
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "$API_URL/api/health"; then echo; exit 0; fi
            sleep 6
          done
          echo "::error::$API_URL/api/health did not respond after deploy"; exit 1

      - name: Skipped
        if: steps.changes.outputs.server != 'true'
        run: echo "No server changes in this push; Heroku left as is."
